<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Splat Viewer</title>
<!-- Local only: served from this Mac on 127.0.0.1 (tools/room-viewer/serve.sh). Shows Gaussian splats (.ply / .splat /
     .ksplat) trained on the Legion or the 5060 PC and copied to recordings/rebuild/<room>-splat/. Nothing is uploaded. -->
<style>
  :root { --bg: #1c1d21; --panel: rgba(28,29,33,0.88); --ink: #eceae6; --muted: #a3a09a; --accent: #e8a33d; --line: rgba(255,255,255,0.12); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; overflow: hidden; }
  #panel { position: fixed; top: 12px; left: 12px; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 300px; }
  #panel h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
  button { background: #2c2d33; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; margin: 2px 0; display: block; width: 100%; text-align: left; }
  button.on { background: var(--accent); color: #1c1d21; border-color: var(--accent); }
  .help, #status { color: var(--muted); font-size: 12px; margin-top: 8px; }
  #view { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>Room splats</h1>
  <div id="list">looking for splats…</div>
  <div id="status"></div>
  <div class="row" style="display:flex;gap:6px;margin-top:8px"><button id="b-fly" class="on" style="width:auto">Fly</button><button id="b-orbit" style="width:auto">Orbit</button></div>
  <div class="help" id="keys"></div>
  <div class="help">Splats are in recordings/rebuild/&lt;room&gt;-splat/. <a href="./" style="color:var(--accent)">Mesh viewer</a></div>
</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import * as GaussianSplats3D from './vendor/gaussian-splats-3d.module.js';
const base = '../../recordings/rebuild/';
const $ = id => document.getElementById(id);
let viewer = null, mode = 'fly', current = null;
const FLY_HELP = 'Fly: W A S D move · Space up · Ctrl or C down (also E up, Q down) · Shift faster · look: drag, arrow keys or two-finger swipe';
const ORBIT_HELP = 'Orbit: drag to turn, right-drag to move, scroll to zoom';
// ?file=<room>-splat/x.splat&cam=x,y,z&look=x,y,z
const sp = new URLSearchParams(location.search), q = {};
for (const k of ['cam', 'look']) if (sp.get(k)) q[k] = sp.get(k).split(',').map(Number);
// a level start view per room, at eye height (floor about y -1.4 in both): standing in the room, looking along it
const START = { 's24-splat': { cam: [1.6, 0.15, -1.0], look: [-1.0, 0.0, -4.6] }, 'ios-splat': { cam: [-0.99, 0.26, -0.20], look: [-0.34, -0.2, -2.37] } };
function startFor(file) {
  if (file === sp.get('file') && q.cam) return q;
  return START[file.split('/')[0]] || { cam: [3, 2.5, 3], look: [0, 0, 0] };
}

// find splat files: the folders ending in -splat (http.server lists directories)
async function listing(path) {
  const r = await fetch(path); if (!r.ok) return [];
  const html = await r.text();
  return [...html.matchAll(/href="([^"]+)"/g)].map(m => decodeURIComponent(m[1]));
}
async function findSplats() {
  const out = [];
  for (const d of (await listing(base)).filter(n => /-splat\/$/.test(n))) {
    const walk = async (p, depth) => {
      for (const f of await listing(base + p)) {
        if (/\.(ply|splat|ksplat)$/i.test(f)) out.push(p + f);
        else if (f.endsWith('/') && depth < 3) await walk(p + f, depth + 1);
      }
    };
    await walk(d, 0);
  }
  return out;
}
async function show(file) {
  current = file;
  [...$('list').children].forEach(b => b.classList.toggle('on', b.dataset.f === file));
  $('keys').textContent = mode === 'fly' ? FLY_HELP : ORBIT_HELP;
  $('status').textContent = 'loading ' + file + '…';
  if (viewer) { await viewer.dispose(); viewer = null; $('view').innerHTML = ''; }
  viewer = new GaussianSplats3D.Viewer({
    rootElement: $('view'),
    // ARKit / ARCore world: y up
    cameraUp: [0, 1, 0], initialCameraPosition: startFor(file).cam, initialCameraLookAt: startFor(file).look,
    sharedMemoryForWorkers: false,   // python's http.server sends no cross-origin isolation headers
    dynamicScene: false, sphericalHarmonicsDegree: 1,
    useBuiltInControls: mode === 'orbit',   // fly mode: our own WASD + look (below) moves the camera
  });
  try {
    await viewer.addSplatScene(base + file, { splatAlphaRemovalThreshold: 5, showLoadingUI: true, progressiveLoad: false });
    viewer.start();
    if (mode === 'fly') startFly(viewer.camera);
    $('status').textContent = file;
  } catch (e) { $('status').textContent = 'could not load: ' + e; }
}
// ---- Fly controls (rk 12 Nov: "basic WASD ctrl+space movement for moving and lowering and raising in the room") ----
// W/S forward/back and A/D sideways, level with the floor (looking down doesn't make you sink); Space / E up,
// Ctrl / C / Q down; Shift = faster (1.5 m/s walking, 4 m/s with Shift); drag to look around. Ctrl+W still closes the
// tab (the browser keeps that one), hence C and Q as the down keys too.
const keys = new Set(); let yaw = 0, pitch = 0, flyCam = null, last = 0, drag = null;
const FLY_KEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space', 'ControlLeft', 'ControlRight', 'KeyC', 'KeyQ', 'KeyE', 'ShiftLeft', 'ShiftRight',
                          'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown']);
addEventListener('keydown', e => {
  if (mode !== 'fly' || !FLY_KEYS.has(e.code) || e.metaKey) return;
  keys.add(e.code); e.preventDefault();        // no page scroll on Space, no Ctrl+S / Ctrl+D save or bookmark dialogs
}, { capture: true });
addEventListener('keyup', e => { keys.delete(e.code); if (e.key === 'Control') { keys.delete('ControlLeft'); keys.delete('ControlRight'); } });
addEventListener('blur', () => keys.clear());
function startFly(cam) {
  flyCam = cam; window.__flyCam = cam;   // (for testing)
  const d = new THREE.Vector3(); cam.getWorldDirection(d);
  yaw = Math.atan2(-d.x, -d.z); pitch = Math.asin(Math.max(-1, Math.min(1, d.y)));
  last = performance.now();
}
// mouse look: listened for on the window, before the splat library's own canvas handlers can swallow the events
// (rk 11:53: dragging did nothing); the panel on the left keeps its clicks
window.addEventListener('pointerdown', e => {
  if (mode !== 'fly' || $('panel').contains(e.target) || e.button !== 0) return;
  drag = [e.clientX, e.clientY]; e.preventDefault();
}, { capture: true });
window.addEventListener('pointerup', () => { drag = null; }, { capture: true });
window.addEventListener('pointermove', e => {
  if (mode !== 'fly' || !drag) return;
  if (e.buttons === 0) { drag = null; return; }
  yaw -= (e.clientX - drag[0]) * 0.0035; pitch = Math.max(-1.5, Math.min(1.5, pitch - (e.clientY - drag[1]) * 0.0035));
  drag = [e.clientX, e.clientY];
}, { capture: true });
// a trackpad's two-finger swipe (wheel events) also looks around in Fly mode
window.addEventListener('wheel', e => {
  if (mode !== 'fly' || $('panel').contains(e.target)) return;
  yaw -= e.deltaX * 0.003; pitch = Math.max(-1.5, Math.min(1.5, pitch - e.deltaY * 0.003)); e.preventDefault();
}, { capture: true, passive: false });
function flyTick(now) {
  requestAnimationFrame(flyTick);
  if (mode !== 'fly' || !flyCam) return;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 4 : 1.5) * dt;
  const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)), right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  const move = new THREE.Vector3();
  if (keys.has('KeyW')) move.add(fwd); if (keys.has('KeyS')) move.sub(fwd);
  if (keys.has('KeyD')) move.add(right); if (keys.has('KeyA')) move.sub(right);
  if (keys.has('Space') || keys.has('KeyE')) move.y += 1;
  if (keys.has('ControlLeft') || keys.has('ControlRight') || keys.has('KeyC') || keys.has('KeyQ')) move.y -= 1;
  if (move.lengthSq() > 0) flyCam.position.addScaledVector(move.normalize(), speed);
  const turn = 1.4 * dt;   // arrow keys: look around (rad/s), for a trackpad without click-drag
  if (keys.has('ArrowLeft')) yaw += turn; if (keys.has('ArrowRight')) yaw -= turn;
  if (keys.has('ArrowUp')) pitch = Math.min(1.5, pitch + turn); if (keys.has('ArrowDown')) pitch = Math.max(-1.5, pitch - turn);
  flyCam.up.set(0, 1, 0);
  flyCam.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
}
requestAnimationFrame(flyTick);
$('b-fly').onclick = () => { if (mode === 'fly') return; mode = 'fly'; $('b-fly').classList.add('on'); $('b-orbit').classList.remove('on'); if (current) show(current); };
$('b-orbit').onclick = () => { if (mode === 'orbit') return; mode = 'orbit'; $('b-orbit').classList.add('on'); $('b-fly').classList.remove('on'); flyCam = null; if (current) show(current); };

const files = await findSplats();
$('list').innerHTML = '';
if (!files.length) $('list').textContent = 'No splats yet. Copy a trained .ply into recordings/rebuild/<room>-splat/ and reload.';
for (const f of files) {
  const b = document.createElement('button'); b.textContent = f; b.dataset.f = f; b.onclick = () => show(f); $('list').appendChild(b);
}
const want = new URLSearchParams(location.search).get('file');
const light = files.find(f => /light\.splat$/.test(f));
if (want || files.length) show(want || light || files[files.length - 1]);
</script>
</body>
</html>
