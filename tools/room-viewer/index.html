<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Rebuild Viewer</title>
<!-- Local only (rk 12 Nov): served from this Mac on 127.0.0.1 by tools/room-viewer/serve.sh; three.js is in vendor/,
     the rooms come from recordings/rebuild/ (never committed, never uploaded). -->
<style>
  :root { --bg: #1c1d21; --panel: rgba(28,29,33,0.88); --ink: #eceae6; --muted: #a3a09a; --accent: #e8a33d; --line: rgba(255,255,255,0.12); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; overflow: hidden; }
  canvas { display: block; }
  #panel { position: fixed; top: 12px; left: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 270px; }
  #panel h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
  .row { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
  button { background: #2c2d33; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button.on { background: var(--accent); color: #1c1d21; border-color: var(--accent); }
  label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  input[type=range] { flex: 1; }
  .help { color: var(--muted); font-size: 12px; margin-top: 8px; }
  #status { color: var(--muted); font-size: 12px; }
  .tag { position: fixed; transform: translate(-50%, -100%); pointer-events: none; background: rgba(20,20,24,0.85); border: 1px solid var(--accent); border-radius: 6px; padding: 3px 7px; font-size: 12px; white-space: nowrap; }
  .tag b { color: var(--accent); font-weight: 600; }
  .tag span { color: var(--muted); }
  #list { margin-top: 8px; max-height: 40vh; overflow: auto; font-size: 12px; border-top: 1px solid var(--line); padding-top: 6px; }
  #list div { padding: 2px 0; cursor: pointer; } #list div:hover { color: var(--accent); }
</style>
</head>
<body>
<div id="panel">
  <h1>Room rebuild · 12 Nov 09:17</h1>
  <div class="row"><button id="b-replay" class="on">Replay (depth)</button><button id="b-wall">Replay + sharp wall</button><button id="b-dots">Dots only</button><button id="b-ios">iPhone 10 Nov 20:09</button></div>
  <div class="row"><button id="b-orbit" class="on">Orbit</button><button id="b-walk">Walk</button><button id="b-top">Top</button></div>
  <div class="row"><button id="b-labels" class="on">Labels</button></div>
  <label>Cut ceiling <input id="cut" type="range" min="0.8" max="3" step="0.05" value="2.0"></label>
  <div id="status">loading…</div>
  <div class="help" id="help"></div>
  <div id="list"></div>
</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/jsm/controls/OrbitControls.js';
import { GLTFLoader } from './vendor/jsm/loaders/GLTFLoader.js';

const ROOMS = { replay: '../../recordings/rebuild/0917-replay/', wall: '../../recordings/rebuild/0917-replay/', dots: '../../recordings/rebuild/0917-dots/', ios: '../../recordings/rebuild/ios-2009/' };
// sharp wall textures (tools/room-rebuild/wall_texture.py): single video frames projected onto a fitted wall plane
const WALLS = { wall: ['wall-01'] };
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1c1d21);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.03, 100);
const orbit = new OrbitControls(camera, renderer.domElement); orbit.enableDamping = true;
const clip = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
const loader = new GLTFLoader();
let room = null, floorY = 0, labels = [], tags = [], mode = 'orbit', which = 'replay', showLabels = true;
const pins = new THREE.Group(); scene.add(pins);
const $ = id => document.getElementById(id);

function setCut() { clip.constant = floorY + parseFloat($('cut').value); }
async function load(key) {
  which = key; ['replay', 'wall', 'dots', 'ios'].forEach(k => $('b-' + k).classList.toggle('on', k === key));
  $('status').textContent = 'loading ' + key + '…';
  const gltf = await loader.loadAsync(ROOMS[key] + 'room.glb');
  if (room) { scene.remove(room); room.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  room = gltf.scene;
  let tris = 0;
  room.traverse(o => { if (o.isMesh) {
    // Open3D writes the vertex colours as plain sRGB; three.js reads vertex colours as linear: convert, or it all looks washed out
    const col = o.geometry.attributes.color;
    if (col && !col.userData?.lin) { const c = new THREE.Color(); for (let i = 0; i < col.count; i++) { c.setRGB(col.getX(i), col.getY(i), col.getZ(i)); c.convertSRGBToLinear(); col.setXYZ(i, c.r, c.g, c.b); } col.needsUpdate = true; }
    o.material = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide, clippingPlanes: [clip] });
    tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
  } });
  scene.add(room);
  let walls = WALLS[key] || [];
  try { const r = await fetch(ROOMS[key] + 'textures.json'); if (r.ok) walls = walls.concat(await r.json()); } catch (e) {}
  for (const w of walls) {
    const info = await (await fetch(ROOMS[key] + w + '.json')).json();
    const tex = await new THREE.TextureLoader().loadAsync(ROOMS[key] + w + '.png');
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    // rk 09:53: the model's own (bumpy) wall triangles are the drawing board: each triangle near the wall plane, where the
    // still has paint, takes its piece of the still (planar projection: its position on the plane = where in the still)
    const cv = document.createElement('canvas'); cv.width = tex.image.width; cv.height = tex.image.height;
    const cx = cv.getContext('2d'); cx.drawImage(tex.image, 0, 0); const A = cx.getImageData(0, 0, cv.width, cv.height).data;
    const o = new THREE.Vector3(...info.corners[0]), ex = new THREE.Vector3(...info.corners[1]).sub(o), ey = new THREE.Vector3(...info.corners[3]).sub(o);
    const wpos = [], wuv = []; const lx = ex.length(), ly = ey.length(); ex.normalize(); ey.normalize(); const nn = new THREE.Vector3(...info.normal);
    room.traverse(m => { if (!m.isMesh || !m.geometry.index || m.material.map) return;
      const P = m.geometry.attributes.position, I = m.geometry.index.array, keep = [], q = new THREE.Vector3();
      for (let t = 0; t < I.length; t += 3) {
        q.set(0, 0, 0); for (let k = 0; k < 3; k++) q.x += P.getX(I[t + k]) / 3, q.y += P.getY(I[t + k]) / 3, q.z += P.getZ(I[t + k]) / 3;
        const r = q.clone().sub(o), dn = r.dot(nn), u = r.dot(ex) / lx, v = r.dot(ey) / ly;
        let hide = false;
        if (Math.abs(dn) < 0.06 && u > 0 && u < 1 && v > 0 && v < 1) { const px = Math.floor(u * cv.width), py = Math.floor((1 - v) * cv.height); hide = A[(py * cv.width + px) * 4 + 3] > 128; }
        if (!hide) keep.push(I[t], I[t + 1], I[t + 2]);
        else for (let k = 0; k < 3; k++) { const vi = I[t + k]; q.set(P.getX(vi), P.getY(vi), P.getZ(vi)); const r2 = q.clone().sub(o);
          wpos.push(q.x, q.y, q.z); wuv.push(r2.dot(ex) / lx, r2.dot(ey) / ly); }
      }
      m.geometry.setIndex(keep); });
    const wg = new THREE.BufferGeometry();
    wg.setAttribute('position', new THREE.Float32BufferAttribute(wpos, 3)); wg.setAttribute('uv', new THREE.Float32BufferAttribute(wuv, 2));
    room.add(new THREE.Mesh(wg, new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, clippingPlanes: [clip] })));
  }
  const box = new THREE.Box3().setFromObject(room);
  // floor: the lowest 2% of vertices
  const ys = []; room.traverse(o => { if (o.isMesh) { const p = o.geometry.attributes.position; for (let i = 0; i < p.count; i += 7) ys.push(p.getY(i)); } });
  ys.sort((a, b) => a - b); floorY = ys[Math.floor(ys.length * 0.02)]; setCut();
  if (!camera.userData.placed) { const c = box.getCenter(new THREE.Vector3()); orbit.target.set(c.x, floorY + 0.5, c.z); camera.position.set(c.x + 5, floorY + 6, c.z + 6); camera.userData.placed = true; }
  try { labels = await (await fetch(ROOMS[key] + 'labels.json')).json(); } catch (e) { labels = []; }
  buildLabels();
  $('status').textContent = `${{ replay: 'Replay: real depth + camera pictures', wall: 'Replay + one wall: its own triangles painted with a single sharp video still', dots: 'Dots only + video pictures', ios: 'iPhone LiDAR + flat surfaces painted from single sharp frames' }[key]} · ${Math.round(tris / 1000)}k triangles`;
}
function buildLabels() {
  tags.forEach(t => t.el.remove()); tags = []; pins.clear(); $('list').innerHTML = '';
  labels.forEach((l, i) => {
    const el = document.createElement('div'); el.className = 'tag';
    el.innerHTML = `<b>${i + 1} ${l.name}</b>${l.size ? ' <span>· ' + l.size + '</span>' : ''}`;
    document.body.appendChild(el);
    const p = new THREE.Vector3(...l.p).add(new THREE.Vector3(0, 0.12, 0));
    tags.push({ el, p });
    const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...l.floor), p]);
    pins.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xe8a33d })));
    const d = document.createElement('div'); d.textContent = `${i + 1}. ${l.name} — ${l.size || ''} (${l.conf})`;
    d.onclick = () => { setMode('orbit'); orbit.target.set(l.floor[0], l.floor[1] + 0.5, l.floor[2]); camera.position.set(l.floor[0] + 1.8, l.floor[1] + 2.2, l.floor[2] + 1.8); };
    $('list').appendChild(d);
  });
  pins.visible = showLabels;
}

// walk: WASD / arrows to move at eye height, drag to look
const keys = {}; let yaw = 0, pitch = -0.15, drag = null;
addEventListener('keydown', e => keys[e.code] = true); addEventListener('keyup', e => keys[e.code] = false);
renderer.domElement.addEventListener('pointerdown', e => { if (mode === 'walk') drag = [e.clientX, e.clientY]; });
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (mode === 'walk' && drag) { yaw -= (e.clientX - drag[0]) * 0.004; pitch = Math.max(-1.4, Math.min(1.4, pitch - (e.clientY - drag[1]) * 0.004)); drag = [e.clientX, e.clientY]; } });
function setMode(m) {
  mode = m; ['orbit', 'walk', 'top'].forEach(k => $('b-' + k).classList.toggle('on', k === m));
  orbit.enabled = m !== 'walk';
  if (m === 'walk') { const d = new THREE.Vector3().subVectors(orbit.target, camera.position); yaw = Math.atan2(-d.x, -d.z); pitch = -0.1; camera.position.set(orbit.target.x, floorY + 1.6, orbit.target.z); }
  if (m === 'top') { orbit.target.set(orbit.target.x, floorY, orbit.target.z); camera.position.set(orbit.target.x, floorY + 11, orbit.target.z + 0.01); }
  $('help').textContent = m === 'walk' ? 'Walk: W A S D or arrows to move (Shift = faster), drag to look around. Eye height 1.6 m.'
    : 'Orbit: drag to turn, right-drag to move, scroll to zoom. Click a name in the list to fly there.';
}
$('b-replay').onclick = () => load('replay'); $('b-wall').onclick = () => load('wall'); $('b-dots').onclick = () => load('dots'); $('b-ios').onclick = () => { camera.userData.placed = false; load('ios'); };
$('b-orbit').onclick = () => setMode('orbit'); $('b-walk').onclick = () => setMode('walk'); $('b-top').onclick = () => setMode('top');
$('b-labels').onclick = () => { showLabels = !showLabels; $('b-labels').classList.toggle('on', showLabels); pins.visible = showLabels; };
$('cut').oninput = setCut;
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const clock = new THREE.Clock(), v = new THREE.Vector3();
function tick() {
  const dt = Math.min(0.05, clock.getDelta());
  if (mode === 'walk') {
    const sp = (keys.ShiftLeft || keys.ShiftRight ? 3 : 1.2) * dt;
    const f = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)), r = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    if (keys.KeyW || keys.ArrowUp) camera.position.addScaledVector(f, sp); if (keys.KeyS || keys.ArrowDown) camera.position.addScaledVector(f, -sp);
    if (keys.KeyD || keys.ArrowRight) camera.position.addScaledVector(r, sp); if (keys.KeyA || keys.ArrowLeft) camera.position.addScaledVector(r, -sp);
    camera.rotation.set(pitch, yaw, 0, 'YXZ');
  } else orbit.update();
  renderer.render(scene, camera);
  for (const t of tags) {
    v.copy(t.p).project(camera);
    const vis = showLabels && v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
    t.el.style.display = vis ? '' : 'none';
    if (vis) { t.el.style.left = (v.x + 1) / 2 * innerWidth + 'px'; t.el.style.top = (1 - v.y) / 2 * innerHeight + 'px'; }
  }
  requestAnimationFrame(tick);
}
// a link can open a version and a view: #wall or #wall@x,y,z,tx,ty,tz (camera, target)
const [hk, hv] = location.hash.slice(1).split('@');
if (hv) { const a = hv.split(',').map(Number); camera.position.set(a[0], a[1], a[2]); orbit.target.set(a[3], a[4], a[5]); camera.userData.placed = true; }
setMode('orbit'); load(ROOMS[hk] ? hk : 'replay'); tick();
</script>
</body>
</html>
