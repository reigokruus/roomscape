plugins { id 'com.android.application' }
android {
    namespace 'com.hackathon.setscan'
    compileSdk 35
    defaultConfig {
        applicationId 'com.hackathon.setscan'
        minSdk 24
        targetSdk 35
        // Without -PbuildNumber: the yyDDDHHmm code build-both.sh uses (a plain assembleDebug once fell back to 1,
        // and the phone refused it as a downgrade). Never lower than an earlier build.
        // Times in Tallinn whatever the build machine's zone (the cloud builds run in UTC). rk 13 Nov 14:33: builds are
        // named by their readable time, as on the iPhone ("Build 13 Nov 14:34:25"); the number stays internal.
        def builtAt = new Date()
        def tallinn = TimeZone.getTimeZone('Europe/Tallinn')
        def buildNo = (project.findProperty('buildNumber') ?: builtAt.format('yyDDDHHmm', tallinn)) as Integer
        versionCode buildNo
        versionName "0.1.${buildNo}"
        def stampFmt = new java.text.SimpleDateFormat('d MMM HH:mm:ss', Locale.UK); stampFmt.setTimeZone(tallinn)
        resValue 'string', 'build_stamp', stampFmt.format(builtAt)
        // -PguestBuild: a build for someone else's phone (rk 10 Nov: the S23+ teammate): camera recording and screen
        // video off by default (storage, heat, privacy); the switches stay in the debug tools
        resValue 'bool', 'guest_build', project.hasProperty('guestBuild') ? 'true' : 'false'
        ndk { abiFilters 'arm64-v8a' } // all current phones; keeps the ML Kit libraries from tripling the APK size
    }
    signingConfigs {
        // Shared debug key (committed on purpose) so builds from CI and any laptop can update each other.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
    // The photo-real viewer (GaussianSplats3D + three.js, MIT) is the iPhone's: copied from CineX.swiftpm/SplatViewer at
    // build time into the APK's assets/SplatViewer/ (one copy in git). Brush's libraries go in src/main/jniLibs
    // (git-ignored, built by tools/brush-android/build.sh); without them the app has no "Make photo-real".
    sourceSets { main { assets.srcDirs += "$buildDir/generated/splatViewerAssets" } }
    androidResources { noCompress 'tflite' } // the depth model is memory-mapped straight from the APK
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'com.google.ar:core:1.57.0'
    // on-device image labelling (bundled model, works offline) to name furniture from the scan photos
    implementation 'com.google.mlkit:image-labeling:17.0.9'
    // optional "Ask Claude" after a scan: names objects and suggests shots from the scan photos
    implementation 'com.anthropic:anthropic-java:3.3.0'
    // object scan: on-device subject cut-out per photo (model comes with Google Play services)
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
    // Depth AI: Depth Anything V2 Small (Apache-2.0) through LiteRT
    implementation 'com.google.ai.edge.litert:litert:2.3.2'
}

// The depth model (28 MB) is downloaded at build time instead of living in git.
def depthModel = file('src/main/assets/depth_anything_v2_small.tflite')
tasks.register('fetchDepthModel') {
    outputs.file(depthModel)
    doLast {
        if (!depthModel.exists() || depthModel.length() < 1000000) {
            depthModel.parentFile.mkdirs()
            def url = 'https://huggingface.co/litert-community/depth-anything-v2-small/resolve/main/tflite/depth_anything_v2_small_wi8_afp32.tflite'
            def tmp = file(depthModel.path + '.part')
            new URL(url).withInputStream { i -> tmp.withOutputStream { it << i } }
            tmp.renameTo(depthModel)
        }
    }
}
preBuild.dependsOn fetchDepthModel

// Opt-in network check; never part of the deterministic/offline test suite or release publication.
tasks.register('verifyCatalogFeed', JavaExec) {
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    mainClass = 'com.hackathon.setscan.CatalogFeedNetworkSmoke'
    if (project.hasProperty('catalogSmokeLocal')) args '--local', file('src/main/assets/equipment-catalog.json').absolutePath
    doFirst { classpath = tasks.named('testDebugUnitTest').get().classpath }
}

// RmscTilesTest on a real scan: ./gradlew testDebugUnitTest -PtilesScan=<scan folder> -PtilesOut=<folder>
tasks.withType(Test).configureEach {
    if (project.hasProperty('tilesScan')) systemProperty 'tiles.scan', project.property('tilesScan')
    if (project.hasProperty('tilesOut')) systemProperty 'tiles.out', project.property('tilesOut')
}

def copySplatViewer = tasks.register('copySplatViewer', Copy) {
    from "$rootDir/../CineX.swiftpm/SplatViewer"
    into "$buildDir/generated/splatViewerAssets/SplatViewer"
}
preBuild.dependsOn copySplatViewer
