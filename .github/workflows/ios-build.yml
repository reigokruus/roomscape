name: iOS build

# Builds the iPhone app (CineX.swiftpm) on every push that touches it and publishes an UNSIGNED .ipa as a GitHub release.
# Install from Windows: download RoomScape-unsigned.ipa from the release and sign/install it with Sideloadly
# (free Apple ID works; the app then expires after 7 days and needs re-installing).
# Releases are not marked latest, so the Android releases/latest link keeps working.
on:
  push:
    branches: [main]
    paths: ['CineX.swiftpm/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Xcode 26 (iOS 26 SDK): the app uses iOS 26 APIs behind #available checks.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and schemes
        working-directory: CineX.swiftpm
        run: |
          xcodebuild -version
          xcodebuild -list
      - name: Build app (no signing)
        working-directory: CineX.swiftpm
        run: |
          xcodebuild build \
            -scheme RoomScape \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package .ipa
        run: |
          APP=$(find CineX.swiftpm/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "No .app produced"; exit 1; }
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry RoomScape-unsigned.ipa Payload
          ls -lh RoomScape-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: RoomScape-unsigned-ipa
          path: RoomScape-unsigned.ipa
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-v0.1.${{ github.run_number }}" RoomScape-unsigned.ipa \
            --title "iOS build ${{ github.run_number }} (unsigned)" \
            --notes "Unsigned build of ${GITHUB_SHA::7}: $(git log -1 --pretty=%s). Sign and install with Sideloadly." \
            --prerelease --latest=false
