name: SetScan
options:
  bundleIdPrefix: com.hackathon
  deploymentTarget:
    iOS: "17.0"
targets:
  SetScan:
    type: application
    platform: iOS
    sources:
      - SetScan
    info:
      path: SetScan/Info.plist
      properties:
        CFBundleDisplayName: SetScan
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        NSCameraUsageDescription: SetScan uses the camera and LiDAR scanner to capture your room.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackathon.setscan
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
